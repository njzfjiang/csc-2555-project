# ============================================
# Fairness Shift Simulation - Experiment Config
# ============================================

# --- Experiment Metadata ---
experiment:
  name: "fairness_shift_phase_diagram"
  seed: 42
  description: "Sweep group-conditional base rates, covariates, and label noise to map DP/EO divergence."

# --- One-Dimensional Diagnostic and Mitigation Sweeps ---
one_dimensional_sweeps:
  num_seeds: 3
  seed_stride: 1000

# --- Data Generation Parameters ---
data:
  num_samples: 5000          
  num_features: 2            
  prior_a: 0.5               # P(A)=0.5
  base_rate_a: 0.3           # P(Y=1|A)
  base_rate_b: 0.3           # P(Y=1|B)

# --- Shift Parameters (Sweep Ranges) ---
shifts:
  # 1. Group-Conditional Base-Rate Shift (α)
  group_shift:
    severity_min: 0.0
    severity_max: 1.0
    num_steps: 11            
    delta: 0.2               
    # base_rate_a = 0.3 + α*0.2, base_rate_b = 0.3 - α*0.2

  # 2. Covariate Shift (γ)
  covariate_shift:
    severity_min: 1.0
    severity_max: 4.0
    num_steps: 10            
    target_group: "A"        

  # 3. Asymmetric Label Noise (β)
  label_shift:
    severity_min: 0.0
    severity_max: 0.3
    num_steps: 10            

# --- Model Parameters ---
model:
  solver: "lbfgs"            
  max_iter: 1000             
  random_state: 42

# --- Metrics Parameters ---
metrics:
  ece_bins: 10               # ECE（Expected Calibration Error）bins

# --- Joint Prior/Label-Noise Danger-Zone Analysis ---
danger_zone:
  min_tpr_increase: 0.05     # Material worsening: 5 percentage points
  max_dp_increase: 0.02      # DP may appear stable within 2 percentage points
  relative_multiplier: 2.0   # Or TPR degradation is at least 2x DP degradation
  min_label_disagreement: 0.05 # Recorded vs. clean TPR gaps differ by 5 points
  num_seeds: 5
  seed_stride: 1000
  consensus_fraction: 0.6    # Mark cells dangerous in at least 3 of 5 seeds

# --- KDE Importance Reweighting ---
reweighting:
  bandwidth: 0.3
  clip_min: 0.1
  clip_max: 10.0
  adaptation_num_samples: 1000
  adaptation_seed_offset: 10000
  max_fit_samples: 1000

# --- Group-Specific TPR Threshold Adjustment ---
threshold_adjustment:
  calibration_num_samples: 1000
  calibration_seed_offset: 30000
  grid_resolution: 0.01

# --- Supplementary Target-Distribution Retraining ---
supplementary:
  train_num_samples: 5000
  train_seed_offset: 20000

# --- Output Paths ---
output:
  log_dir: "outputs/logs"
  figure_dir: "outputs/figures"
